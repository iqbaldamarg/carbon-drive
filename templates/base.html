<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarbonDrive Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --cd-green: #2d6a4f;
      --cd-green-light: #40916c;
      --cd-green-pale: #d8f3dc;
    }
    body {
      background-color: #f4f7f5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .navbar-brand { font-weight: 700; letter-spacing: -0.3px; }
    .navbar { background-color: var(--cd-green) !important; }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    .card-header {
      background-color: #fff;
      border-bottom: 1px solid #eee;
      border-radius: 12px 12px 0 0 !important;
    }
    .btn-success, .btn-success:hover {
      background-color: var(--cd-green);
      border-color: var(--cd-green-light);
    }
    .btn-outline-success {
      color: var(--cd-green);
      border-color: var(--cd-green);
    }
    .btn-outline-success:hover {
      background-color: var(--cd-green);
      border-color: var(--cd-green);
    }
    .badge-aman       { background-color: #198754; }
    .badge-perhatian  { background-color: #ffc107; color: #333; }
    .badge-kritis     { background-color: #dc3545; }
    .bg-tren-turun    { background-color: #d8f3dc; }
    .bg-tren-naik     { background-color: #fde8e8; }
    .bg-tren-sama     { background-color: #f4f4f4; }
    .stat-card        { border-left: 4px solid var(--cd-green); }
    .label-stat       { font-size:.72rem; font-weight:600; text-transform:uppercase;
                        letter-spacing:.05em; color:#666; margin-bottom:.25rem; }
    .table th         { font-size: 0.8rem; text-transform: uppercase;
                        letter-spacing: 0.05em; color: #666; }

    /* Reset card states */
    .card-reset-danger        { border: 1px solid #f5c6cb !important; }
    .card-reset-normal        { border: 1px solid #dee2e6; }
    .card-header-reset-danger { background: #fff5f5; border-bottom: 1px solid #f5c6cb; }
    .card-header-reset-normal { background: #fff;    border-bottom: 1px solid #eee; }

    /*
     * Dashboard background — menggunakan ::before pseudo-element
     * agar TIDAK mengganggu z-index modal Bootstrap.
     *
     * JANGAN gunakan background-image atau background-attachment: fixed
     * langsung pada body/class, karena itu membuat compositing layer
     * yang merusak stacking context modal.
     */
    .dashboard-bg::before {
      content: '';
      position: fixed;
      inset: 0;                /* setara top:0; right:0; bottom:0; left:0 */
      background-image: url('/static/images/bg_dashboard.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;             /* di bawah semua konten termasuk modal */
    }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">

{% if session.username %}
<nav class="navbar navbar-dark px-3 mb-4">
  <a class="navbar-brand p-0" href="/dashboard">
    <img src="{{ url_for('static', filename='images/logo.png') }}"
         alt="CarbonDrive"
         style="height: 60px; width: auto; object-fit: contain;">
  </a>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white opacity-75 small">{{ session.username }}</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Keluar & Simpan</a>
  </div>
</nav>
{% endif %}

<div class="container pb-5" style="max-width: 900px;">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
